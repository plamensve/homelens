name: Validate and package HomeLens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run validate
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: homelens-chrome-extension
          path: dist/homelens-chrome-v1.0.0.zip
          if-no-files-found: error

